  <g id="text_22">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #617481" transform="translate(38.88 466.73209)">Above ceiling: Vital/Protected supplies Unsafe evidence; Manageable blocks CTA admission. Equality passes.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #617481" transform="translate(38.88 477.534551)">Bowel epithelium and identified fibroblasts use Manageable; bulk retains its organ tier.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #617481" transform="translate(38.88 488.337012)">Native TPM/nTPM numbers are linked. Corneal CP10K uses nominal /100, not a TPM conversion.</text>
