  </g>
  <g id="text_22">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #617481" transform="translate(35.64 431.63209)">Candidate equality passes. RNA above the ceiling and below 2× is Neither; RNA ≥2× is Unsafe.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #617481" transform="translate(35.64 442.434551)">Native TPM/nTPM remain separate assays. CP10K uses nominal values /100, not an empirical TPM conversion.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #617481" transform="translate(35.64 453.237012)">Negative IHC requires matching tissue/cell coverage, a positive profile control and no unresolved antibody conflict.</text>
  </g>
