  <g id="text_35">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #617481" x="45.36" y="57.318281" transform="rotate(-0 45.36 57.318281)">The two funnel stages remove 112 and 122 genes for different reasons; neither stage proves biological absence.</text>
  </g>
  <g id="text_36">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #617481" transform="translate(45.36 463.494551)">All 48 measured tumor failures have positive maxima (0.5288–9.9904 pTPM); none has a measured zero maximum.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #617481" transform="translate(45.36 474.297012)">Coverage groups are mutually exclusive. Independently, 114 lack corneal coverage, 31 lack bulk coverage and 18 lack DICE coverage.</text>
  </g>
