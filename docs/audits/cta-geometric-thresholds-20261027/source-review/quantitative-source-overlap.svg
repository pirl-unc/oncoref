   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b3a" x="43.74" y="37.988719" transform="rotate(-0 43.74 37.988719)">Two quantitative nomination routes</text>
