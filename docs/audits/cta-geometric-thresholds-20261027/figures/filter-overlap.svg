  <g id="text_38">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b3a" x="43.74" y="37.016719" transform="rotate(-0 43.74 37.016719)">Which RNA filters do the work?</text>
  </g>
  <g id="text_39">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #617481" x="43.74" y="55.158281" transform="rotate(-0 43.74 55.158281)">Each filter is evaluated against the same 2,948 genes entering normal-RNA screening.</text>
  </g>
  <g id="text_40">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #617481" transform="translate(43.74 442.434551)">Independent failures overlap and must not be summed. The right panel changes one filter at a time, keeping all other gates.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #617481" transform="translate(43.74 453.237012)">For example, removing the HPA tissue-cluster filter alone would add 118 genes to the 319 selected.</text>
  </g>
