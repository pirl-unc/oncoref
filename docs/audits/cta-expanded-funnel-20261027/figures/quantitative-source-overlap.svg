  </g>
  <g id="text_14">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #617481" x="43.74" y="57.318281" transform="rotate(-0 43.74 57.318281)">HPA reproductive RNA and Tyser embryonic RNA are alternative entry routes; every later filter still applies.</text>
  </g>
  <g id="text_15">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #617481" transform="translate(43.74 463.494551)">HPA v23: testis/ovary/placenta ≥5 nTPM and greater than nonreproductive bulk. Tyser E-MTAB-9388: supported lineage mean ≥5 TPM.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #617481" transform="translate(43.74 474.297012)">Tyser is one early embryo, not a curated oncofetal-antigen list. Circle areas are comparable only within each panel.</text>
  </g>
