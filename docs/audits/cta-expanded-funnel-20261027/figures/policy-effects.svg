  <g id="text_22">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #617481" x="38.88" y="55.158281" transform="rotate(-0 38.88 55.158281)">Separate the lower tumor floor, broader cohort union, optional coverage and final evidence reconciliation.</text>
  </g>
  <g id="text_23">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #617481" transform="translate(38.88 442.434551)">The first four rows are quantitative candidates. The last row additionally applies accepted normal-protein, clinical-safety and antibody-review rules.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #617481" transform="translate(38.88 453.237012)">Optional coverage does not discard observed DICE or corneal RNA evidence. No gene-specific positive-control admission rule is used.</text>
