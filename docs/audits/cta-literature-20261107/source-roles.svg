<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img"><title>Distinct roles of measurement and literature sources</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#216b72"/></marker></defs><rect width="1200" height="480" fill="#f7f5ef"/><g font-family="system-ui,sans-serif" fill="#203338"><text x="30" y="40" font-size="25">How the sources contribute</text><text x="30" y="68" font-size="15">Classification is based on measurements and adjudicated findings. Paper coverage is recorded separately.</text>
