   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203a57" x="55.44" y="47.03625" transform="rotate(-0 55.44 47.03625)">A consistent, explainable CTA definition</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526477" x="55.44" y="73.918125" transform="rotate(-0 55.44 73.918125)">Proposed PR dependencies  •  One decision contract, then evidence and sequence qualification</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203a57" x="72.576" y="137.397656" transform="rotate(-0 72.576 137.397656)">1  Decision contract</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(72.576 165.300781)">Definition, evidence status and sequence roles</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(72.576 184.275781)">Held or incomplete does not imply allowed  •  #640 / #647 / #607</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203a57" x="732.816" y="136.257891" transform="rotate(-0 732.816 136.257891)">Independent  •  #626</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(732.816 166.414844)">Isolate shard caches</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(732.816 184.275781)">Land before large replays</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203a57" x="57.456" y="299.397656" transform="rotate(-0 57.456 299.397656)">2  Evidence reconciliation</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(57.456 327.726641)">MAGEC2, LGALS13, PLCZ1</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(57.456 346.836406)">MAGE-A12 / EPS8L2</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(57.456 365.811406)">#633–635 / #654</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203a57" x="377.496" y="299.397656" transform="rotate(-0 377.496 299.397656)">3  One tissue policy</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(377.496 327.300781)">Current breadth uses ontology</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(377.496 346.275781)">Preserve historical replay</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(377.496 366.26332)">#637</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203a57" x="697.536" y="299.397656" transform="rotate(-0 697.536 299.397656)">4  Sequence qualification</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(697.536 327.755391)">Locus, CDS and translation QC</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(697.536 346.836406)">SERPINA2 / MROH5</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(697.536 366.26332)">#657</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203a57" x="218.736" y="475.797656" transform="rotate(-0 218.736 475.797656)">5  Verified sequence bundle</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(218.736 503.700781)">Policy, reference, hashes, occurrences and coverage</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(218.736 522.675781)">Consumer migration and offline replay  •  #641 / #647</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203a57" x="218.736" y="619.797656" transform="rotate(-0 218.736 619.797656)">6  Public definition and report</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(218.736 647.700781)">One receipt supplies narrative, flow, counts and evidence views</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #354555" transform="translate(218.736 666.61918)">HTML / PDF / SVG / CSV / JSON  •  #607</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64748b" x="55.44" y="709.2" transform="rotate(-0 55.44 709.2)">4 November 2026  •  Proposed work, not released policy or scientific results</text>
