screening_policies:
  tiered_cta: &tiered_cta
    policy_id: oncoref.cta-permitted-screen.2026-10-21.2
    permitted_scope: reproductive_or_permitted_normal
    required_positive_scope: reproductive
    minimum_reproductive_rna: 0.0
    reproductive_rna_comparison: greater_than
    tier_labels:
      permitted: Permitted
      vital: Vital
      protected: Protected
      manageable: Manageable
      unresolved: Unresolved
    rna_source: hpa_rna_consensus
    rna_source_version: v23
    rna_species: human
    rna_unit: nTPM
    # Compatibility key; positive evidence is required in required_positive_scope.
    minimum_permitted_rna: 1.0
    positive_ihc_levels:
    - Low
    - Medium
    - High
    - Ascending
    - Descending
    vital:
      maximum_rna: 2.0
      minimum_reproductive_selectivity: 0.75
      roots:
      - heart
      - lung
      - bronchus
      - brain
      - spinal_cord
      - liver
      - kidney
      - bone_marrow
      - blood
      - adrenal_gland
      - pituitary_gland
      - pancreas
      - small_intestine
      - skeletal_muscle
      - smooth_muscle
      - peripheral_nerve
      - endothelium
      - blood_vessel
      - retina
      - eye
      - inner_ear
      description: Strictest project tier for organs whose extensive injury can
        threaten life or cause major irreversible neurological or sensory loss.
        Includes all mapped descendants. Vital is the stable machine identifier;
        the full meaning is vital or critical function.
    protected:
      maximum_rna: 6.0
      minimum_reproductive_selectivity: 0.70
      roots:
      - salivary_gland
      - parathyroid_gland
      - lymph_node
      - esophagus
      - stomach
      - colon
      - rectum
      - urinary_bladder
      - ureter
      - cartilage
      - oral_mucosa
      - nasopharynx
      - tongue
      description: Higher protection priority for persistent functional or structural
        injury and important mucosal or distributed-organ function. Any positive
        IHC excludes. Injury can be severe or fatal; this is a relative research priority.
    manageable:
      maximum_rna: 10.0
      minimum_reproductive_selectivity: 0.65
      roots:
      - skin
      - spleen
      - thymus
      - thyroid_gland
      - adipose_tissue
      description: Conditional manageability is a relative project priority, informed by published caution/non-essential
        groups and organ-specific evidence. These tissues remain screened and any positive
        IHC excludes. The name describes potential management or compensation for
        selected injuries, not established control of every injury. It does not imply reversibility, local-steroid control or
        dispensability. Explicit permitted cutaneous compartments take precedence over skin.
    context_reviews:
      removable_digestive_organs:
        roots: [appendix, gallbladder]
        flags: [in_situ_inflammation_review]
        references: [nhs_appendix, niddk_gallbladder]
        rationale: Organ removal can be tolerated, but in-situ immune injury may
          cause inflammation, leakage or obstruction. The allowance does not extend
          to adjacent intestine, liver, bile ducts or shared immune populations.
        allowance_basis: organ_removal
        local_steroid_control: not_established
      skin_injury_extent:
        roots: [skin]
        flags: [skin_compartment_and_extent_review, local_control_not_guaranteed]
        references: [sitc2021, johnson2009, bradley2020]
        rationale: Whole skin is Manageable and remains subject to RNA and IHC gates.
          Distinguish permitted cutaneous pigment
          or follicular loss from extensive epithelial, blistering or mucosal injury.
          Local corticosteroid use for selected toxicities is not guaranteed rescue
          from persistent antigen-directed T cells.
        allowance_basis: no_whole_skin_allowance
        local_steroid_control: supported_for_selected_manifestations_not_general_ablation
      salivary_function:
        roots: [salivary_gland]
        flags: [persistent_salivary_dysfunction_review, local_control_not_established]
        references: [warner2019, bradley2020]
        rationale: Salivary glands are Protected. Published immune-mediated injury can cause persistent low
          salivary secretion despite symptom improvement. Minor-gland expression
          does not establish restriction to one removable gland.
        allowance_basis: no_default_allowance
        local_steroid_control: not_established_with_persistent_dysfunction_reported
      lymphoid_organ_review:
        roots: [tonsil, spleen, thymus]
        flags: [immune_cell_distribution_review, age_and_immune_reserve_review]
        references: [nhs_tonsillectomy, cdc_asplenia, nci_lymph_nodes, project_policy]
        rationale: Only tonsil retains a conditional allowance; spleen and thymus
          are Manageable and must pass RNA and IHC gates. Identify the expressing cell
          population and its distribution in blood, marrow and other organs.
          Assess age and immune reserve. Surgery is not a model of systemic
          antigen-directed injury. Bulk tissue cannot establish organ confinement.
        allowance_basis: tonsil_only_conditional_allowance
        local_steroid_control: not_established
      spleen_infection_risk:
        roots: [spleen]
        flags: [asplenia_infection_risk_review]
        references: [cdc_asplenia, kristinsson2014]
        rationale: Assess consequences of functional asplenia and an appropriate
          infection-prevention and management strategy before therapeutic acceptance.
        local_steroid_control: not_established
      thymus_long_term_function:
        roots: [thymus]
        flags: [thymic_function_review, age_and_immune_reserve_review]
        references: [kooshesh2023]
        rationale: Adult thymectomy has observational associations with mortality
          and cancer. Thymus is Manageable, not disposable; pediatric consequences need
          separate review. Surgery does not quantify antigen-directed injury.
        local_steroid_control: not_established
      cartilage_structural_function:
        roots: [cartilage]
        flags: [persistent_structural_injury_review, cartilage_site_review]
        references: [heinemeier2016, braaten2020]
        rationale: Cartilage is Protected because structural injury may persist.
          Articular-collagen turnover and inflammatory-arthritis studies provide
          indirect support, not direct chondrocyte-targeting safety evidence. A generic
          cartilage label does not locate a joint or exclude airway cartilage.
        local_steroid_control: symptom_control_does_not_establish_structural_repair
      distributed_lymph_nodes:
        roots: [lymph_node]
        flags: [lymphatic_and_immune_function_review]
        references: [nci_lymph_nodes]
        rationale: Remains Protected. Regional removal does not justify whole-system
          depletion or injury to lymphatic stroma. Lineage-specific exceptions
          require a separately defined policy and evidence.
    unresolved_roots:
    - head
    - foot
    - soft_tissue
    references:
    - project_policy
    - hpa_tissue_specificity
    - hpa_tissues
    - nci_organ_inflammation
    - niddk_adrenal
    - nhs_tonsillectomy
    - cdc_asplenia
    - nci_lymph_nodes
    - nei_retina
    - johnson2009
    - bradley2020
    - kaufmann2019
    - kooshesh2023
    - kristinsson2014
    - heinemeier2016
    - braaten2020
    - warner2019
    - sitc2021
    review_semantics: Review annotations do not add numerical tiers or establish
      clinical acceptability. Positive observations in flagged contexts remain
      visible even when a candidate passes the research expression screen.
    coverage: Complete routine bulk RNA is required. Missing or partial IHC is
      reported explicitly and cannot establish protein absence. Unresolved positive
      anatomy, unusable measurements and reviewed unreliable IHC block retention.
    species_note: Anatomical tiers apply to human, dog and mouse. The numerical
      policy is calibrated only as a project screen for human HPA v23 nTPM;
      numerical thresholds and clinical tolerability do not transfer to other species.
  ihc_adaptive_cta:
    <<: *tiered_cta
    policy_id: oncoref.cta-ihc-adaptive-screen.2026-10-21.2
    ihc_source: hpa_normal_tissue
    ihc_source_version: v23
    negative_ihc_rna_limits:
      Missing:
        vital: 2.0
        protected: 6.0
        manageable: 10.0
      Uncertain:
        vital: 2.0
        protected: 6.0
        manageable: 10.0
      Approved:
        vital: 4.0
        protected: 8.0
        manageable: 20.0
      Supported:
        vital: 6.0
        protected: 12.0
        manageable: 30.0
      Enhanced:
        vital: 12.0
        protected: 24.0
        manageable: 60.0
    negative_ihc_rule: Relax only with valid Not detected observations in every
      routine IHC tissue/cell context mapping to the same anatomical tissue as
      the RNA measurement. Use the weakest reliability among all observations
      in that tissue. Missing contexts, unknown reliability, invalid observations,
      positive staining or reviewed-unreliable IHC cannot earn relaxation.
      A narrower region cannot clear a broader organ; other organs cannot supply
      negative evidence. Enhanced describes source validation, not a guaranteed
      limit of detection for a negative stain or for peptide-HLA presentation.
    negative_ihc_minimum_reproductive_selectivity:
      Missing: {vital: 0.75, protected: 0.70, manageable: 0.65}
      Uncertain: {vital: 0.75, protected: 0.70, manageable: 0.65}
      Approved: {vital: 0.70, protected: 0.65, manageable: 0.60}
      Supported: {vital: 0.65, protected: 0.60, manageable: 0.55}
      Enhanced: {vital: 0.60, protected: 0.55, manageable: 0.50}
    reproductive_selectivity:
      formula: Rmax / (Rmax + tissue_rna_ntpm)
      reference: Maximum valid raw RNA across mapped Reproductive tissues for the
        same gene, species, source and version. Disposable does not enter the reference.
      minimum_reference: Strictly positive; a zero or missing reference is unresolved.
      comparison: Inclusive minimum per screened RNA observation. The same local
        negative-IHC evidence chooses both the RNA ceiling and selectivity threshold.
      aggregation: Every screened tissue must pass both gates. Category summaries
        report the worst margin against its own threshold, not a pooled category score.
      meaning: Pairwise expression selectivity, not percent of total-body RNA or protein.
        Uses raw nTPM without deflation, averaging, tissue sums or rounding before gating.
      provenance: User-approved target-informed project recalibration on 2026-10-21.
        The previous percentage ladder was too stringent when transferred from a
        global deflated fraction to a raw pairwise score. The new grid preserves
        higher protection for Vital and relaxes with local negative-IHC confidence.
        Named CTA recovery is a calibration check, not independent validation.
    threshold_provenance: User-directed update on 2026-10-21 doubles all absolute
      RNA ceilings, making 2 nTPM the lowest outside-tissue limit. Vital uses
      2/4/6/12, Protected 6/8/12/24, and Manageable 10/20/30/60 nTPM for
      Missing-or-Uncertain/Approved/Supported/Enhanced negative IHC.
      Reproductive admission remains RNA >0 or positive IHC. Selectivity minima
      and the positive-IHC veto are unchanged. These are research screening
      parameters, not clinically validated safety limits. Trial inclusion does
      not override measured protein expression or external safety evidence.
