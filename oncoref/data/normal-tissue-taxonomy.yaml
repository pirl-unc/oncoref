schema: oncoref.normal-tissue-taxonomy
schema_version: 1
policy_version: 2026-10-21.2
taxon_ids:
- 9606
- 9615
- 10090
references:
  collin2021:
    title: A single cell atlas of human cornea that defines its development, limbal progenitor cells and their interactions with the immune cells
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8343164/
    kind: primary_research
    scope: Human corneal, limbal and conjunctival compartments; adult and developmental samples remain distinct.
  blagosklonny2003:
    title: Tissue-selective therapy of cancer
    url: https://doi.org/10.1038/sj.bjc.6601256
    kind: conceptual_minireview
    scope: 'Proposed examples: melanocytes, prostate, testis, breast, ovary; not an
      exhaustive or clinically validated whitelist.'
  openstax_female:
    title: 'Anatomy and Physiology: Female Reproductive System'
    url: https://openstax.org/books/anatomy-and-physiology/pages/27-2-anatomy-and-physiology-of-the-female-reproductive-system
    kind: anatomy
    scope: Reproductive organs, ovarian compartments, and mammary glands as accessory
      reproductive organs.
  openstax_male:
    title: 'Anatomy and Physiology: Male Reproductive System'
    url: https://openstax.org/books/anatomy-and-physiology/pages/27-1-anatomy-and-physiology-of-the-male-reproductive-system
    kind: anatomy
    scope: Testis, excurrent ducts, accessory glands and external genitalia.
  mouse_anatomy:
    title: The Anatomy of the Laboratory Mouse, Margaret J. Cook
    url: https://www.informatics.jax.org/cookbook/chapters/contents2.shtml
    kind: comparative_anatomy
    scope: Mouse reproductive anatomy; anatomical applicability does not establish
      therapeutic tolerability.
  dog_anatomy:
    title: Male reproductive pelvic and external genitalia, ICAR-IVRI
    url: https://veterinaryanatomy.com/atlas/hindlimb-pelvis/splanchnology/male-reproductive-pelvic-and-external-genitalia/
    kind: comparative_anatomy
    scope: Dog lacks seminal vesicles and bulbourethral glands; prostate is its principal
      accessory sex gland.
  hpa_tissues:
    title: Human Protein Atlas tissue and cell-type definitions
    url: https://www.proteinatlas.org/humanproteome/tissue/data
    kind: source_documentation
    scope: Source tissue and cell-type labels; version-specific mapping rows refer
      to the v23 files.
  hpa_skin:
    title: 'Human Protein Atlas: skin histology'
    url: https://www.proteinatlas.org/learn/dictionary/normal/skin
    kind: source_documentation
    scope: Skin melanocytes and hair follicles are separate compartments from other
      skin cells.
  hpa_pigment:
    title: 'Human Protein Atlas: pigment cells'
    url: https://www.proteinatlas.org/humanproteome/single%2Bcell/single%2Bcell%2Btype/pigment%2Bcells
    kind: source_documentation
    scope: Skin melanocytes distinct from retinal pigment epithelial cells.
  johnson2009:
    title: Gene therapy with human and mouse T-cell receptors mediates cancer regression
      and targets normal tissues expressing cognate antigen
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2929689/
    kind: clinical_study
    scope: Melanocyte-antigen targeting can affect skin, eye and ear; a cutaneous
      exception must not include ocular or inner-ear compartments.
  purba2019:
    title: CDK4/6 inhibition mitigates stem cell damage in a novel model for taxane-induced
      alopecia
    url: https://pubmed.ncbi.nlm.nih.gov/31512803/
    kind: human_ex_vivo_study
    scope: Follicular matrix and stem-cell injury differ; follicular toxicity can
      cause persistent alopecia. Supports compartment distinction, not safety of immune
      ablation.
  nci_alopecia:
    title: Hair Loss (Alopecia) and Cancer Treatment
    url: https://www.cancer.gov/about-cancer/treatment/side-effects/hair-loss
    kind: clinical_information
    scope: Alopecia is a recognized cancer-treatment toxicity; regrowth and permanence
      depend on treatment.
  barkbase2019:
    title: 'BarkBase: Epigenomic Annotation of Canine Genomes'
    url: https://doi.org/10.3390/genes10060433
    kind: primary_atlas
    scope: Canine adult and embryonic tissues; retain source developmental-stage terminology.
  fetal_atlas2020:
    title: A human cell atlas of fetal gene expression
    url: https://pubmed.ncbi.nlm.nih.gov/33184181/
    kind: primary_atlas
    scope: Fetal organ and cell identities are stage-specific and must not stand for
      adult-organ evidence.
  hpa_tissue_specificity:
    title: Human Protein Atlas v23 tissue specificity definitions
    url: https://v23.proteinatlas.org/humanproteome/tissue/tissue%2Bspecific
    kind: primary_atlas
    scope: HPA tissue enrichment compares expression against other tissues. This
      is a conceptual specificity precedent, not validation of the project maximum
      reproductive reference, selectivity grid, or therapeutic safety limits.
  project_policy:
    title: oncoref normal-tissue scope policy, version 1
    url: https://github.com/pirl-unc/oncoref/blob/main/docs/normal-tissue-scopes.md
    kind: project_definition
    scope: Reproductive includes reproductive organs, mammary tissue, placenta, extraembryonic,
      embryonic and fetal contexts. Disposable normal is a conditional research scope,
      not a clinical safety claim. The permitted scope includes cutaneous melanocytes,
      follicles, tonsil, appendix and gallbladder. Manageable separates skin, spleen,
      thymus, thyroid and adipose from Protected tissues. Tiered RNA ceilings are project
      screening parameters; IHC detections outside the permitted scope remain exclusions.
  nci_organ_inflammation:
    title: Immunotherapy and Organ-Related Inflammation
    url: https://www.cancer.gov/about-cancer/treatment/side-effects/organ-inflammation
    kind: clinical_information
    scope: Organ-specific immune injury supports conservative review of normal
      expression. Does not validate this project's tissue tiers or numerical cutoffs.
  niddk_adrenal:
    title: Definition and Facts of Adrenal Insufficiency and Addison's Disease
    url: https://www.niddk.nih.gov/health-information/endocrine-diseases/adrenal-insufficiency-addisons-disease/definition-facts
    kind: clinical_information
    scope: Adrenal crisis can be life-threatening. Supports including adrenal and
      pituitary contexts in the conservative vital tier; not an RNA threshold validation.
  mouse_coagulating:
    title: 'MGI Adult Mouse Anatomy: coagulating gland (MA:0000402)'
    url: https://www.informatics.jax.org/vocab/gxd/ma_ontology/MA%3A0000402
    kind: anatomy_ontology
    scope: Mouse male reproductive gland, synonym prostate gland anterior lobe.
  mouse_lymphoid:
    title: 'Janeway Immunobiology: Organization of the mucosal immune system'
    url: https://nerd.wwnorton.com/ebooks/epub/janeway10/EPUB/content/12.1-chapter12.xhtml
    kind: comparative_anatomy
    scope: Mouse nasal-associated lymphoid tissue is not anatomically a tonsil.
  nhs_tonsillectomy:
    title: Making a decision about recurrent tonsillitis in children and adults
    url: https://www.england.nhs.uk/wp-content/uploads/2023/10/decision-support-tool-making-a-decision-about-recurrent-tonsillitis-in-children-and-adults.pdf
    kind: clinical_information
    scope: Tonsillectomy is an established intervention; other tissues also provide
      immune functions. Surgical tolerability does not validate systemic immune ablation.
  cdc_asplenia:
    title: Risk Factors for Meningococcal Disease
    url: https://www.cdc.gov/meningococcal/risk-factors/index.html
    kind: clinical_information
    scope: Anatomic or functional asplenia increases serious infection risk.
      Spleen allowance requires an infection-risk and mitigation assessment.
  nci_lymph_nodes:
    title: Sentinel Lymph Node Biopsy
    url: https://www.cancer.gov/about-cancer/diagnosis-staging/staging/sentinel-node-biopsy-fact-sheet
    kind: clinical_information
    scope: Lymph nodes contain mobile immune cells. More extensive removal increases
      lymphedema and infection risks; regional surgery does not validate systemic injury.
  nei_retina:
    title: National Plan for Eye and Vision Research
    url: https://www.nei.nih.gov/sites/default/files/nei-pdfs/nationalplan1.pdf
    kind: clinical_information
    scope: Retinal injury can cause severe irreversible visual disability. Supports
      critical-function protection independently of immediate mortality.
  bradley2020:
    title: Vestigial-like 1 is a shared targetable cancer-placenta antigen expressed by pancreatic and basal-like breast cancers
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7577998/
    kind: primary_target_selection_study
    scope: Supplementary Table 2 specifies danger, hazard, caution and non-essential
      tissue groups with GTEx TPM screening thresholds. These are study parameters,
      not validated organ-injury limits or transferable HPA nTPM thresholds.
  kaufmann2019:
    title: Large-scale in-silico identification of a tumor-specific antigen pool for targeted immunotherapy in triple-negative breast cancer
    url: https://www.oncotarget.com/article/26808/text/
    kind: primary_target_selection_study
    scope: Essential brain/heart/lung and graded predicted adverse events in other
      tissues support relative protection priorities, not these numerical ceilings.
  kooshesh2023:
    title: Health Consequences of Thymus Removal in Adults
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10557034/
    kind: observational_clinical_study
    scope: Adult thymectomy was associated with higher mortality and cancer
      incidence. Observational association does not establish causality or immune-injury risk.
  kristinsson2014:
    title: Long-term risks after splenectomy among 8149 cancer-free American veterans
    url: https://haematologica.org/article/view/6942
    kind: observational_clinical_study
    scope: Increased long-term infection and thromboembolic risks support screening
      spleen expression rather than treating spleen as a default disposable organ.
  heinemeier2016:
    title: Radiocarbon dating reveals minimal collagen turnover in both healthy and osteoarthritic human cartilage
    url: https://pubmed.ncbi.nlm.nih.gov/27384346/
    kind: primary_human_tissue_study
    scope: Minimal replacement of mature articular cartilage collagen supports
      concern about lasting structural damage; not direct evidence of immune toxicity.
  braaten2020:
    title: Immune checkpoint inhibitor-induced inflammatory arthritis persists after immunotherapy cessation
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7031780/
    kind: prospective_observational_clinical_study
    scope: Persistent inflammatory arthritis supports concern about chronic joint
      injury; arthritis is not equivalent to selective chondrocyte targeting.
  warner2019:
    title: Sicca Syndrome Associated with Immune Checkpoint Inhibitor Therapy
    url: https://pubmed.ncbi.nlm.nih.gov/30996010/
    kind: clinical_series
    scope: In 20 patients, symptoms often improved with treatment but salivary
      secretion remained very low. Does not support reliable local-steroid rescue.
  sitc2021:
    title: SITC clinical practice guideline on immune checkpoint inhibitor-related adverse events
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8237720/
    kind: clinical_guideline
    scope: Skin and other organ toxicities are graded by manifestation and severity.
      Local treatment for selected skin events does not establish controllability
      of extensive antigen-directed cell killing.
  nhs_appendix:
    title: Appendicitis
    url: https://www.nhs.uk/conditions/appendicitis/
    kind: clinical_information
    scope: Appendix removal is compatible with normal life; surgical outcomes do
      not establish the consequences of in-situ immune inflammation or perforation.
  niddk_gallbladder:
    title: Treatment for Gallstones
    url: https://www.niddk.nih.gov/health-information/digestive-diseases/gallstones/treatment
    kind: clinical_information
    scope: Normal life is possible without a gallbladder; post-removal digestive
      effects can occur. No allowance for liver or bile ducts is implied.
  fetal_gonads2007:
    title: MAGE-A1, GAGE and NY-ESO-1 cancer/testis antigen expression during human gonadal development
    url: https://pubmed.ncbi.nlm.nih.gov/17208940/
    kind: primary_developmental_expression_study
    scope: CTA expression in fetal testes and ovaries demonstrates why adult
      male restriction does not establish maternal or fetal exclusion.
